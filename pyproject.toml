[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mpa-bridge"
version = "0.0.1"
description = "Protocol tool for mpa-atlas: validate, compile, round-trip, discover, gap-report."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "ronviers" }]
license = { text = "Proprietary (unlicensed)" }
dependencies = [
    "jsonschema>=4.21",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
]

[project.scripts]
mpa-bridge = "mpa_bridge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
